[package]
name = "fs-tracker"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Best-effort Linux process-tree file change tracker"
license = "MIT"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2.7"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
